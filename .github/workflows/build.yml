name: Build Mobile Apps
on: [push]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anima-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - run: npm install
      
      - run: npx cap add ios || true 
      - run: npx cap sync ios
      
      - name: Build iOS (No Signing)
        run: |
          cd ios/App/App # Moving into the actual project folder
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          
      - name: Upload iOS Project
        uses: actions/upload-artifact@v4
        with:
          name: anima-ios-project
          path: ios/App