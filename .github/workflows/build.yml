name: Anima Build and Deploy action
on:
  push:
    branches:
      - anima-v2-deploy
  pull_request:
    branches:
       - anima-v2-deploy
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Version Name (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'
      is_prerelease:
        description: 'Is this a Pre-release?'
        type: boolean
        default: false

jobs:
  build:
    #strategy:
      #matrix:
        #os: [windows-latest, ubuntu-latest]

    #runs-on: ${{ matrix.os }}

    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        #with:
            #version: '6.5.3'
            #arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || 'gcc_64' }}
        with:
            version: '6.8.3'
            arch: 'win64_msvc2022_64'

      - name: Setup MSVC (Windows Only)
        #if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

     # - name: Install Linux Deps
       # if: matrix.os == 'ubuntu-latest'
        #run: |
         # sudo apt-get update
         # sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Bundle Windows
        if: matrix.os == 'windows-latest'
        run: windeployqt --qmldir . build/Release/Anima.exe

      - name: Create ZIP
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          directory: ${{ matrix.os == 'windows-latest' && 'build/Release' || 'build' }}
          filename: Anima-v2.zip

      #- name: Save Private Test Build
        #uses: actions/upload-artifact@v4
        #with:
         # name: Private-Testing-Build-${{ matrix.os }}
          #path: "**/*.zip"

      - name: Create Official Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_name }}
          name: Anima ${{ github.event.inputs.release_name }}
          body_path: CHANGELOG.md
          prerelease: ${{ github.event.inputs.is_prerelease }}
          files: "**/*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}