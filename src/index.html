<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>Anima Editor</title>
    <style>
        :root {
            --bg: #0b0b0b;
            --panel: #141414;
            --panel-light: #1e1e1e;
            --accent: #3d5afe;
            --accent-hover: #536dfe;
            --border: #282828;
            --text: #ececec;
            --text-dim: #717171;
            --radius: 6px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        #mainCanvas {
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
            overscroll-behavior: none;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        #header {
            height: 38px;
            background: var(--panel);
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            z-index: 100;
        }

        #settings-trigger {
            margin-left: auto;
            color: var(--text-dim);
            transition: color 0.2s;
            font-size: 14px;
        }

        #settings-trigger:hover {
            color: var(--accent);
        }

        #workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            pointer-events: none;
        }

        #toolbar {
            width: 60px;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 8px;
            border-right: 1px solid var(--border);
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tool-btn:hover {
            background: var(--panel-light);
            color: #fff;
        }

        .tool-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 15px rgba(61, 90, 254, 0.4);
        }

        .tool-settings {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding-bottom: 15px;
        }

        .tool-settings label {
            font-size: 9px;
            font-weight: 900;
            color: var(--text-dim);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 3px;
            background: #333;
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: var(--text);
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="number"] {
            background: #000;
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 4px;
            font-family: monospace;
            outline: none;
            font-size: 16px;
        }

        #colorPicker {
            width: 30px;
            height: 30px;
            border: 2px solid var(--border);
            border-radius: 50%;
            overflow: hidden;
            background: none;
            cursor: pointer;
        }

        #stage-container {
            flex: 1;
            background: #050505;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            pointer-events: auto;
        }

        #canvas-wrapper {
            position: absolute;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
            background: white;
            pointer-events: none;
        }

        #timeline-panel {
            height: 150px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            height: 30px;
        }

        #playBtn {
            padding: 0 20px;
            height: 28px;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        #playBtn:hover {
            background: var(--accent-hover);
        }

        .timeline-slider-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 10px;
            font-weight: bold;
            color: var(--text-dim);
        }

        #frameSlider {
            flex: 1;
        }

        #frame-strip {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding: 5px;
            background: #0d0d0d;
            border-radius: var(--radius);
            height: 90px;
            border: 1px solid var(--border);
        }

        .thumb {
            min-width: 55px;
            height: 100%;
            background: #1a1a1a;
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            font-size: 9px;
            color: #444;
            padding-bottom: 4px;
            border: 1px solid transparent;
            flex-shrink: 0;
        }

        .thumb.active {
            border-color: var(--accent);
            color: var(--accent);
            background: #222;
        }

        .thumb.has-data {
            border-bottom: 2px solid #555;
            color: #888;
        }

        #settings-menu {
            display: none;
            position: absolute;
            top: 45px;
            right: 10px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 1000;
            width: 200px;
        }

        #cursor {
            width: 10px;
            height: 10px;
            border: 1px solid #fff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            mix-blend-mode: difference;
            z-index: 10000;
            transform: translate(-50%, -50%);
        }

        body.platform-desktop #toolbar {
            width: 60px;
            flex-direction: column;
        }


        @media (max-width: 800px) {
            .tool-settings label {
                background: var(--accent);
                color: white;
                padding: 2px 6px;
                border-radius: 4px;
                font-size: 8px;
                z-index: 5;
            }

            #workspace {
                position: relative;
                flex: 1;
                display: flex;
                overflow: hidden;
            }

            #stage-container {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
            }

            #toolbar,
            .tool-settings,
            #header {
                z-index: 10;
            }

            #timeline-panel {
                position: relative;
                z-index: 100;
                background: var(--panel);
                height: 130px;
                min-height: 130px;
            }

            body.platform-mobile #header {
                position: absolute;
                top: 10px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 200;
                background: rgba(20, 20, 20, 0.9);
                backdrop-filter: blur(10px);
                border-radius: 30px;
            }

            body.platform-mobile #toolbar {
                position: absolute;
                left: 15px;
                top: 50%;
                transform: translateY(-50%);
                z-index: 200;
                background: rgba(20, 20, 20, 0.9);
                border-radius: 25px;
                height: auto;
            }

            .tool-settings {
                position: absolute;
                right: 15px;
                top: 50%;
                transform: translateY(-50%);
                z-index: 200;
            }

            body.platform-mobile #timeline-panel {
                width: 95%;
                height: 100px;
                background: rgba(10, 10, 10, 0.95);
                border: 1px solid var(--accent);
            }
        }

        @media (max-width: 950px) and (orientation: landscape) {
            body.platform-mobile #toolbar {
                left: env(safe-area-inset-left, 10px);
                gap: 15px;
            }

            body.platform-mobile .tool-settings {
                right: env(safe-area-inset-right, 10px);
            }

            body.platform-mobile #timeline-panel {
                width: 50%;
                left: 25%;
                bottom: 5px;
                height: 70px;
            }
        }

        .platform-mobile #cursor {
            display: none !important;
        }

        body.platform-mobile #header {
            display: none;
        }

        body.platform-mobile #workspace {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        body.platform-mobile #stage-container {
            background-size: 30px 30px;
        }

        body.platform-mobile #toolbar {
            left: calc(10px + env(safe-area-inset-left));
            top: auto;
            bottom: calc(130px + env(safe-area-inset-bottom));
            transform: none;
            flex-direction: row;
            padding: 8px;
            gap: 10px;
            pointer-events: auto;
        }

        body.platform-mobile .tool-settings {
            right: calc(10px + env(safe-area-inset-right));
            top: auto;
            bottom: calc(130px + env(safe-area-inset-bottom));
            transform: none;
            padding: 10px;
            pointer-events: auto;
        }

        body.platform-mobile .tool-settings input[type="range"] {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            appearance: none;
            width: 15px;
            height: 120px;
            background: #333;
        }

        body.platform-mobile #timeline-panel {
            position: absolute;
            bottom: calc(15px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            height: 110px;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        body.platform-mobile #cursor {
            display: none !important;
        }

        body.platform-mobile .tool-btn {
            width: 50px;
            height: 50px;
            font-size: 22px;
        }

        #canvas-wrapper {
            position: absolute;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
            background: white;
            pointer-events: none;
        }

        #drawingCanvas {
            position: absolute;
            z-index: 3;
            background: transparent;
            pointer-events: auto;
            touch-action: none;
        }

        body.platform-mobile .tool-settings {
            right: calc(10px + env(safe-area-inset-right));
            padding: 15px 5px;
            gap: 15px;
        }

        body.platform-mobile #toolbar {
            left: calc(10px + env(safe-area-inset-left));
            padding: 10px 5px;
        }
    </style>
</head>

<body>
    <div id="cursor"></div>

    <div id="header">
        <span style="color: var(--accent)">ANIMA</span>
        <span style="color: var(--text-dim); margin-left: 8px; font-weight: 400;">// 2D ENGINE v1.0</span>

        <div id="settings-trigger">⚙️</div>

        <div id="settings-menu">
            <div style="font-size: 9px; color: var(--accent); margin-bottom: 8px;">SMOOTHING (LAZY MOUSE)</div>
            <input type="range" id="smoothingSlider" min="0" max="0.9" step="0.05" value="0.5" style="width: 100%;">
            <div style="height: 1px; background: var(--border); margin: 12px 0;"></div>
            <div style="font-size: 9px; color: var(--text-dim); line-height: 1.6;">
                B: Brush | E: Eraser | G: Bucket<br>
                Space: Play | Ctrl+Z: Undo
            </div>
        </div>
    </div>

    <div id="workspace">
        <div id="toolbar">
            <button class="tool-btn active" id="brushTool" title="Brush (B)">🖌️</button>
            <!--<button class="tool-btn" id="rectTool" title="Rectangle (R)">🟦</button>--> <!--SOON!!!!!-->
            <button class="tool-btn" id="eraseTool" title="Eraser (E)">🧽</button>
            <button class="tool-btn" id="bucketTool" title="Paint Bucket (G)">🪣</button>

            <div style="width: 20px; height: 1px; background: var(--border); margin: 5px 0;"></div>

            <input type="color" id="colorPicker" value="#000000">

            <div class="tool-settings">
                <label>SIZE</label>
                <input type="range" id="brushSize" min="1" max="100" value="5">
                <label>OPAC</label>
                <input type="range" id="brushOpacity" min="1" max="100" value="100">
            </div>
        </div>

        <div id="stage-container">
            <div id="canvas-wrapper">
                <canvas id="onionCanvas" width="1920" height="1080"
                    style="position: absolute; pointer-events: none; z-index: 1; opacity: 0.4;"></canvas>
                <canvas id="mainCanvas" width="1920" height="1080"
                    style="position: relative; z-index: 2; background: transparent;"></canvas>

                <canvas id="drawingCanvas" width="1920" height="1080"
                    style="position: absolute; z-index: 3; background: transparent;"></canvas>
            </div>
        </div>
    </div>

    <div id="timeline-panel">
        <div class="controls">
            <button id="playBtn">▶ PLAY</button>

            <div class="timeline-slider-container">
                <span>FPS</span>
                <input type="number" id="fpsInput" value="12" style="width: 32px;">

                <span style="margin-left: 10px;">LEN</span>
                <input type="number" id="durationInput" value="60" style="width: 40px;">

                <span id="frameCounter" style="font-family: monospace; color: var(--accent); margin-left: 10px;">00 /
                    60</span>

                <input type="range" id="frameSlider" min="0" max="60" value="0">

                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" id="loopToggle" checked> LOOP
                </label>
            </div>
        </div>

        <div id="frame-strip"></div>
    </div>

    <div id="frame-context-menu"
        style="display: none; position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 20000; min-width: 120px; padding: 5px 0;">
        <style>
            .menu-item {
                padding: 8px 12px;
                font-size: 11px;
                cursor: pointer;
                color: var(--text);
                transition: background 0.2s;
            }

            .menu-item:hover {
                background: var(--accent);
            }

            .menu-item.danger:hover {
                background: #cc3333;
            }
        </style>
        <div class="menu-item" id="ctx-duplicate">Duplicate Frame</div>
        <div class="menu-item" id="ctx-clear">Clear Content</div>
        <div style="height: 1px; background: var(--border); margin: 5px 0;"></div>
        <div class="menu-item danger" id="ctx-delete">Remove Frame</div>
    </div>

    <div id="export-overlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
        <div style="color: var(--accent); font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;">EXPORTING
            ENGINE...</div>
        <div id="export-bar-bg"
            style="width: 200px; height: 4px; background: #222; border-radius: 2px; overflow: hidden;">
            <div id="export-bar-fill"
                style="width: 0%; height: 100%; background: var(--accent); transition: width 0.3s;"></div>
        </div>
        <div id="export-status"
            style="font-size: 10px; color: var(--text-dim); margin-top: 10px; font-family: monospace;">0%</div>
    </div>

    <script type="module">
        const isCapacitor = !!window.Capacitor;
        const isMobile = isCapacitor || ('ontouchstart' in window);

        const script = document.createElement('script');
        script.type = 'module';

        if (isMobile) {
            document.body.classList.add('platform-mobile');
            script.src = 'mobile-renderer.js';
            if (isCapacitor) window.Capacitor.Plugins.StatusBar?.hide();
        } else {
            document.body.classList.add('platform-desktop');
            script.src = 'desktop-renderer.js';
        }

        document.body.appendChild(script);
    </script>

</html>
