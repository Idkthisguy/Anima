<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Anima Editor</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --panel: #1a1a1a;
            --accent: #3d5afe;
            --accent-hover: #536dfe;
            --border: #2e2e2e;
            --text: #e0e0e0;
            --text-dim: #888;
            --radius: 8px;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        /* Header */
        #header {
            height: 40px;
            background: var(--panel);
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent);
            z-index: 100;
        }

        #workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* Professional Toolbar */
        #toolbar {
            width: 70px;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 0;
            gap: 10px;
            border-right: 1px solid var(--border);
            z-index: 50;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            width: 44px;
            height: 44px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tool-btn:hover {
            background: #2a2a2a;
            color: white;
        }

        .tool-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(61, 90, 254, 0.3);
        }

        /* Tool Settings (Vertical sliders look cleaner) */
        .tool-settings {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding-bottom: 20px;
            font-size: 10px;
            color: var(--text-dim);
        }

        .tool-settings label {
            margin-bottom: -10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 50px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Stage */
        #stage-container {
            flex: 1;
            background: #0a0a0a;
            background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
            background-size: 32px 32px;
            overflow: hidden;
            position: relative;
            cursor: none;
        }

        #canvas-wrapper {
            position: absolute;
            transform-origin: 0 0;
            background: white;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        /* Modern Timeline */
        #timeline-panel {
            height: 160px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 15px;
            z-index: 100;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        #playBtn {
            min-width: 90px;
            height: 32px;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        #playBtn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .timeline-slider-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #frame-strip {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            background: #111;
            padding: 10px;
            flex: 1;
            border-radius: var(--radius);
            border: 1px solid #222;
        }

        .thumb {
            min-width: 45px;
            height: 60px;
            background: #252525;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 5px;
            font-size: 10px;
            font-weight: bold;
            color: #555;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .thumb.active {
            background: #333;
            border-color: var(--accent);
            color: var(--accent);
        }

        .thumb.has-data {
            background: #2a2a2a;
            color: #aaa;
            border-top: 3px solid #444;
        }

        #cursor {
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            mix-blend-mode: difference;
            z-index: 9999;
            transform: translate(-50%, -50%);
            display: none;
        }
    </style>
</head>

<body>
    <div id="cursor"></div>
    <div id="header">ANIMA // 2D ENGINE</div>

    <div id="workspace">
        <div id="toolbar">
            <button class="tool-btn active" id="brushTool" title="Brush (B)">🖌️</button>
            <button class="tool-btn" id="rectTool" title="Rectangle (R)">🟦</button>
            <button class="tool-btn" id="eraseTool" title="Eraser (E)">🧽</button>
            <button class="tool-btn" id="bucketTool" title="Paint Bucket (G)">🪣</button>

            <div style="width: 30px; height: 1px; background: var(--border); margin: 10px 0;"></div>

            <input type="color" id="colorPicker" value="#000000"
                style="width:34px; height:34px; border:2px solid var(--border); border-radius:50%; padding:0; background:none; cursor:pointer;">

            <div class="tool-settings">
                <label>SIZE</label>
                <input type="range" id="brushSize" min="1" max="100" value="5">

                <label>OPAC</label>
                <input type="range" id="brushOpacity" min="1" max="100" value="100">
            </div>
        </div>

        <div id="stage-container">
            <div id="canvas-wrapper">
                <canvas id="onionCanvas" width="1920" height="1080"
                    style="position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1;"></canvas>

                <canvas id="mainCanvas" width="1920" height="1080"
                    style="position: relative; z-index: 2; background: transparent;"></canvas>
            </div>
        </div>
    </div>

    <div id="timeline-panel">
        <div class="controls">
            <button id="playBtn">▶ Play</button>

            <div class="timeline-slider-container">
                <label style="font-size: 11px; color: var(--text-dim);">FPS
                    <input type="number" id="fpsInput" value="12"
                        style="width:35px; background:#000; color:var(--accent); border:none; padding:3px; border-radius:4px; font-weight:bold;">
                </label>

                <span id="frameCounter" style="font-size: 11px; font-family: monospace; min-width: 80px;">FRAME:
                    00</span>

                <input type="range" id="frameSlider" min="0" max="60" value="0" style="flex: 1; height: 2px;">

                <label style="font-size: 11px; color: var(--text-dim); cursor: pointer;">
                    <input type="checkbox" id="loopToggle" checked> LOOP
                </label>
            </div>
        </div>
        <div id="frame-strip"></div>
    </div>

    <script type="module" src="renderer.js"></script>
</body>

</html>
