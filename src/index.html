<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>Anima Editor</title>
    <link rel="stylesheet" href="./style.css">

</head>

<body>
    <div id="crosshair"></div>
    <div id="brush-preview"></div>

    <div id="header">
        <span style="color: var(--accent)"><img id="header-logo" src="../Anima_header.png" style="width: 100px;"></span>
        <span style="color: var(--text-dim); margin-left: 8px; font-weight: 400;">// 2D ENGINE v1.2</span>

        <div id="settings-trigger"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-settings-icon lucide-settings">
                <path
                    d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
                <circle cx="12" cy="12" r="3" />
            </svg></div>

        <div id="settings-menu">
            <div style="font-size: 9px; color: var(--accent); margin-bottom: 8px;">SMOOTHING (LAZY MOUSE)</div>
            <input type="range" id="smoothingSlider" min="0" max="0.9" step="0.05" value="0.5" style="width: 100%;">
            <div style="height: 1px; background: var(--border); margin: 12px 0;"></div>
            <div style="font-size: 9px; color: var(--accent); margin-bottom: 6px;">CANVAS SIZE</div>
            <select id="resolutionPicker" style="
    background: #000; color: var(--accent); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 6px; font-size: 10px; width: 100%; cursor: pointer;
">
                <option value="1920x1080">1920 × 1080 (Full HD)</option>
                <option value="1080x1920">1080 x 1920 (9:16 Full HD)</option>
                <option value="1280x720">1280 × 720 (HD)</option>
                <option value="854x480">854 × 480 (480p)</option>
                <option value="512x512">512 × 512 (Square)</option>
                <option value="800x600">800 × 600 (4:3)</option>
                <option value="350x350">350 × 350</option>
                <option value="250x250">250 × 250</option>
            </select>
            <label
                style="display:flex; align-items:center; gap:6px; margin-top:8px; font-size:9px; color:var(--text-dim); cursor:pointer;">
                <input type="checkbox" id="keepDrawingsOnResize" checked>
                Keep drawings on resize
            </label>
            <div style="height: 1px; background: var(--border); margin: 12px 0;"></div>
            <div style="font-size: 9px; color: var(--text-dim); line-height: 1.6;">
                B: Brush | E: Eraser | G: Bucket<br>
                Space: Play | Ctrl+Z: Undo
            </div>
        </div>
    </div>

    <div id="workspace">
        <div id="toolbar">
            <div class="tool-group">
                <button class="tool-btn active" id="brushTool" title="Brush (B)"><svg xmlns="http://www.w3.org/2000/svg"
                        width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-brush-icon lucide-brush">
                        <path d="m11 10 3 3" />
                        <path d="M6.5 21A3.5 3.5 0 1 0 3 17.5a2.62 2.62 0 0 1-.708 1.792A1 1 0 0 0 3 21z" />
                        <path d="M9.969 17.031 21.378 5.624a1 1 0 0 0-3.002-3.002L6.967 14.031" />
                    </svg></button>
                <!--<button class="tool-btn" id="rectTool" title="Rectangle (R)"></button>--> <!--SOON!!!!!-->
                <button class="tool-btn" id="eraseTool" title="Eraser (E)"><svg xmlns="http://www.w3.org/2000/svg"
                        width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eraser-icon lucide-eraser">
                        <path
                            d="M21 21H8a2 2 0 0 1-1.42-.587l-3.994-3.999a2 2 0 0 1 0-2.828l10-10a2 2 0 0 1 2.829 0l5.999 6a2 2 0 0 1 0 2.828L12.834 21" />
                        <path d="m5.082 11.09 8.828 8.828" />
                    </svg></button>
                <button class="tool-btn" id="bucketTool" title="Paint Bucket (G)"><svg
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-paint-bucket-icon lucide-paint-bucket">
                        <path d="M11 7 6 2" />
                        <path d="M18.992 12H2.041" />
                        <path
                            d="M21.145 18.38A3.34 3.34 0 0 1 20 16.5a3.3 3.3 0 0 1-1.145 1.88c-.575.46-.855 1.02-.855 1.595A2 2 0 0 0 20 22a2 2 0 0 0 2-2.025c0-.58-.285-1.13-.855-1.595" />
                        <path
                            d="m8.5 4.5 2.148-2.148a1.205 1.205 0 0 1 1.704 0l7.296 7.296a1.205 1.205 0 0 1 0 1.704l-7.592 7.592a3.615 3.615 0 0 1-5.112 0l-3.888-3.888a3.615 3.615 0 0 1 0-5.112L5.67 7.33" />
                    </svg></button>

                <div class="color-picker-wrapper">
                    <input type="color" id="colorPicker" value="#000000">
                </div>

            </div>

            <div class="divider"></div>

            <div class="tool-group">
                <button class="tool-btn" id="undoBtn" title="Undo (Ctrl+Z)" style="font-size: 14px;"><svg
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-undo-icon lucide-undo">
                        <path d="M3 7v6h6" />
                        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" />
                    </svg></button>
                <button class="tool-btn" id="redoBtn" title="Redo (Ctrl+Y)" style="font-size: 14px;"><svg
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-redo-icon lucide-redo">
                        <path d="M21 7v6h-6" />
                        <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7" />
                    </svg></button>

                <button class="tool-btn" id="copyBtn" title="Copy Frame (CmdOrCtrl + C)"><svg
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
                    </svg>
                </button>

                <button class="tool-btn" id="pasteBtn" title="Paste Frame (CmdOrCtrl + P)"><svg
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
                    </svg>

                </button>
            </div>

            <div class="tool-settings">
                <label>SIZE</label>
                <input type="range" id="brushSize" min="1" max="100" value="5">
                <label>OPAC</label>
                <input type="range" id="brushOpacity" min="1" max="100" value="100">
            </div>
        </div>

        <div id="stage-container">
            <div id="canvas-wrapper">
                <canvas id="onionCanvas" width="1920" height="1080"
                    style="position: absolute; pointer-events: none; z-index: 1; opacity: 0.4;"></canvas>

                <canvas id="mainCanvas" width="1920" height="1080"
                    style="position: relative; z-index: 2; background: transparent; pointer-events: auto;"></canvas>

            </div>
        </div>
    </div>

    <div id="timeline-panel">
        <div class="controls">
            <button id="playBtn" title="Play (Space)">
                <span class="btn-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-play-icon lucide-play">
                        <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" />
                    </svg>
                </span>
            </button>

            <div class="timeline-slider-container">
                <span>FPS</span>
                <input type="number" id="fpsInput" value="12" style="width: 32px;">

                <span style="margin-left: 10px;">LEN</span>
                <input type="number" id="durationInput" value="60" style="width: 40px;">

                <span id="frameCounter" style="font-family: monospace; color: var(--accent); margin-left: 10px;">00 /
                    60</span>

                <input type="range" id="frameSlider" min="0" max="60" value="0">
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" id="loopToggle" checked> LOOP
                </label>
            </div>
        </div>

        <div id="frame-strip"></div>
    </div>

    <div id="frame-context-menu"
        style="display: none; position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 20000; min-width: 120px; padding: 5px 0;">
        <style>
            .menu-item {
                padding: 8px 12px;
                font-size: 11px;
                cursor: pointer;
                color: var(--text);
                transition: background 0.2s;
            }

            .menu-item:hover {
                background: var(--accent);
            }

            .menu-item.danger:hover {
                background: #cc3333;
            }
        </style>
        <div class="menu-item" id="ctx-duplicate">Duplicate Frame</div>
        <div class="menu-item" id="ctx-clear">Clear Content</div>
        <div style="height: 1px; background: var(--border); margin: 5px 0;"></div>
        <div class="menu-item danger" id="ctx-delete">Remove Frame</div>
    </div>

    <div id="export-overlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
        <div style="color: var(--accent); font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;">RENDERING...
        </div>
        <div id="export-bar-bg"
            style="width: 200px; height: 4px; background: #222; border-radius: 2px; overflow: hidden;">
            <div id="export-bar-fill"
                style="width: 0%; height: 100%; background: var(--accent); transition: width 0.3s;"></div>
        </div>
        <div id="export-status"
            style="font-size: 10px; color: var(--text-dim); margin-top: 10px; font-family: monospace;">0%</div>
    </div>

    <script src="./gif.js"></script>
    <script type="module" src="renderer.js"></script>

</html>
