<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale:1.0, maximum-scale:1.0, user-scalable:no">
    <title>Anima Editor</title>
    <style>
        :root {
            --bg: #0b0b0b;
            --panel: #141414;
            --panel-light: #1e1e1e;
            --accent: #3d5afe;
            --accent-hover: #536dfe;
            --border: #282828;
            --text: #ececec;
            --text-dim: #717171;
            --radius: 6px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        /* Header */
        #header {
            height: 38px;
            background: var(--panel);
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            z-index: 100;
        }

        #settings-trigger {
            margin-left: auto;
            color: var(--text-dim);
            transition: color 0.2s;
            font-size: 14px;
        }

        #settings-trigger:hover {
            color: var(--accent);
        }

        /* Workspace */
        #workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Toolbar */
        #toolbar {
            width: 60px;
            background: var(--panel);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 8px;
            border-right: 1px solid var(--border);
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tool-btn:hover {
            background: var(--panel-light);
            color: #fff;
        }

        .tool-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 15px rgba(61, 90, 254, 0.4);
        }

        .tool-settings {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding-bottom: 15px;
        }

        .tool-settings label {
            font-size: 9px;
            font-weight: 900;
            color: var(--text-dim);
        }

        /* Inputs */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 3px;
            background: #333;
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: var(--text);
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="number"] {
            background: #000;
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 2px 4px;
            font-family: monospace;
            outline: none;
        }

        #colorPicker {
            width: 30px;
            height: 30px;
            border: 2px solid var(--border);
            border-radius: 50%;
            overflow: hidden;
            background: none;
            cursor: pointer;
        }

        /* Canvas Area */
        #stage-container {
            flex: 1;
            background: #050505;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 50px 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #canvas-wrapper {
            position: absolute;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
            background: white;
        }

        /* Timeline */
        #timeline-panel {
            height: 150px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            height: 30px;
        }

        #playBtn {
            padding: 0 20px;
            height: 28px;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        #playBtn:hover {
            background: var(--accent-hover);
        }

        .timeline-slider-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 10px;
            font-weight: bold;
            color: var(--text-dim);
        }

        #frameSlider {
            flex: 1;
        }

        #frame-strip {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            padding: 5px;
            background: #0d0d0d;
            border-radius: var(--radius);
            height: 80px;
            border: 1px solid var(--border);
        }

        .thumb {
            min-width: 55px;
            height: 100%;
            background: #1a1a1a;
            border-radius: 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            font-size: 9px;
            color: #444;
            padding-bottom: 4px;
            border: 1px solid transparent;
            flex-shrink: 0;
        }

        .thumb.active {
            border-color: var(--accent);
            color: var(--accent);
            background: #222;
        }

        .thumb.has-data {
            border-bottom: 2px solid #555;
            color: #888;
        }

        /* Settings Overlay */
        #settings-menu {
            display: none;
            position: absolute;
            top: 45px;
            right: 10px;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            z-index: 1000;
            width: 200px;
        }

        #cursor {
            width: 10px;
            height: 10px;
            border: 1px solid #fff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            mix-blend-mode: difference;
            z-index: 10000;
            transform: translate(-50%, -50%);
        }

        /* MOBILE OVERRIDE */
        @media (max-width: 768px) {
            #header {
                height: 50px;
            }

            /* Thicker header for thumbs */

            #toolbar {
                width: 100%;
                height: 60px;
                flex-direction: row;
                /* Horizontal toolbar on mobile */
                justify-content: space-around;
                border-right: none;
                border-top: 1px solid var(--border);
                position: fixed;
                bottom: 150px;
                /* Sits above timeline */
                z-index: 100;
            }

            #workspace {
                flex-direction: column;
            }

            #stage-container {
                background-size: 25px 25px;
                /* Smaller grid for mobile */
            }

            #canvas-wrapper {
                transform: scale(0.4);
                /* Shrink canvas to fit phone screen */
            }

            .tool-btn {
                width: 50px;
                height: 50px;
                font-size: 24px;
                /* Chunky buttons for fingers */
            }

            .tool-settings {
                display: none;
            }

            /* Hide sliders on mobile to save space */

            #timeline-panel {
                height: 150px;
                position: fixed;
                bottom: 0;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="cursor"></div>

    <div id="header">
        <span style="color: var(--accent)">ANIMA</span>
        <span style="color: var(--text-dim); margin-left: 8px; font-weight: 400;">// 2D ENGINE v1.0</span>

        <div id="settings-trigger">⚙️</div>

        <div id="settings-menu">
            <div style="font-size: 9px; color: var(--accent); margin-bottom: 8px;">SMOOTHING (LAZY MOUSE)</div>
            <input type="range" id="smoothingSlider" min="0" max="0.9" step="0.05" value="0.5" style="width: 100%;">
            <div style="height: 1px; background: var(--border); margin: 12px 0;"></div>
            <div style="font-size: 9px; color: var(--text-dim); line-height: 1.6;">
                B: Brush | E: Eraser | G: Bucket<br>
                Space: Play | Ctrl+Z: Undo
            </div>
        </div>
    </div>

    <div id="workspace">
        <div id="toolbar">
            <button class="tool-btn active" id="brushTool" title="Brush (B)">🖌️</button>
            <!--<button class="tool-btn" id="rectTool" title="Rectangle (R)">🟦</button>--> <!--SOON!!!!!-->
            <button class="tool-btn" id="eraseTool" title="Eraser (E)">🧽</button>
            <button class="tool-btn" id="bucketTool" title="Paint Bucket (G)">🪣</button>

            <div style="width: 20px; height: 1px; background: var(--border); margin: 5px 0;"></div>

            <input type="color" id="colorPicker" value="#000000">

            <div class="tool-settings">
                <label>SIZE</label>
                <input type="range" id="brushSize" min="1" max="100" value="5">
                <label>OPAC</label>
                <input type="range" id="brushOpacity" min="1" max="100" value="100">
            </div>
        </div>

        <div id="stage-container">
            <div id="canvas-wrapper">
                <canvas id="onionCanvas" width="1920" height="1080"
                    style="position: absolute; pointer-events: none; z-index: 1; opacity: 0.4;"></canvas>
                <canvas id="mainCanvas" width="1920" height="1080"
                    style="position: relative; z-index: 2; background: transparent;"></canvas>
            </div>
        </div>
    </div>

    <div id="timeline-panel">
        <div class="controls">
            <button id="playBtn">▶ PLAY</button>

            <div class="timeline-slider-container">
                <span>FPS</span>
                <input type="number" id="fpsInput" value="12" style="width: 32px;">

                <span style="margin-left: 10px;">LEN</span>
                <input type="number" id="durationInput" value="60" style="width: 40px;">

                <span id="frameCounter" style="font-family: monospace; color: var(--accent); margin-left: 10px;">00 /
                    60</span>

                <input type="range" id="frameSlider" min="0" max="60" value="0">

                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" id="loopToggle" checked> LOOP
                </label>
            </div>
        </div>

        <div id="frame-strip"></div>
    </div>

    <div id="frame-context-menu"
        style="display: none; position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 20000; min-width: 120px; padding: 5px 0;">
        <style>
            .menu-item {
                padding: 8px 12px;
                font-size: 11px;
                cursor: pointer;
                color: var(--text);
                transition: background 0.2s;
            }

            .menu-item:hover {
                background: var(--accent);
            }

            .menu-item.danger:hover {
                background: #cc3333;
            }
        </style>
        <div class="menu-item" id="ctx-duplicate">Duplicate Frame</div>
        <div class="menu-item" id="ctx-clear">Clear Content</div>
        <div style="height: 1px; background: var(--border); margin: 5px 0;"></div>
        <div class="menu-item danger" id="ctx-delete">Remove Frame</div>
    </div>

    <div id="export-overlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
        <div style="color: var(--accent); font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;">EXPORTING
            ENGINE...</div>
        <div id="export-bar-bg"
            style="width: 200px; height: 4px; background: #222; border-radius: 2px; overflow: hidden;">
            <div id="export-bar-fill"
                style="width: 0%; height: 100%; background: var(--accent); transition: width 0.3s;"></div>
        </div>
        <div id="export-status"
            style="font-size: 10px; color: var(--text-dim); margin-top: 10px; font-family: monospace;">0%</div>
    </div>

    <script type="module" src="renderer.js"></script>
</body>

</html>
