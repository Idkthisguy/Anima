<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title>Anima Editor</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div id="crosshair"></div>
    <div id="brush-preview"></div>

    <div id="header">
        <span style="color: var(--accent)">ANIMA</span>
        <span style="color: var(--text-dim); margin-left: 8px; font-weight: 400;">// 2D ENGINE v1.1</span>

        <div id="settings-trigger">⚙️</div>

        <div id="settings-menu">
            <div style="font-size: 9px; color: var(--accent); margin-bottom: 8px;">SMOOTHING (LAZY MOUSE)</div>
            <input type="range" id="smoothingSlider" min="0" max="0.9" step="0.05" value="0.5" style="width: 100%;">
            <div style="height: 1px; background: var(--border); margin: 12px 0;"></div>
            <div style="font-size: 9px; color: var(--text-dim); line-height: 1.6;">
                B: Brush | E: Eraser | G: Bucket<br>
                Space: Play | Ctrl+Z: Undo
            </div>
        </div>
    </div>

    <div id="workspace">
        <div id="toolbar">
            <button class="tool-btn active" id="brushTool" title="Brush (B)">🖌️</button>
            <!--<button class="tool-btn" id="rectTool" title="Rectangle (R)">🟦</button>--> <!--SOON!!!!!-->
            <button class="tool-btn" id="eraseTool" title="Eraser (E)">🧽</button>
            <button class="tool-btn" id="bucketTool" title="Paint Bucket (G)">🪣</button>

            <div style="width: 20px; height: 1px; background: var(--border); margin: 5px 0;"></div>

            <button class="tool-btn" id="undoBtn" title="Undo (Ctrl+Z)" style="font-size: 14px;">↩️</button>
            <button class="tool-btn" id="redoBtn" title="Redo (Ctrl+Y)" style="font-size: 14px;">↪️</button>

            <input type="color" id="colorPicker" value="#000000">

            <div class="tool-settings">
                <label>SIZE</label>
                <input type="range" id="brushSize" min="1" max="100" value="5">
                <label>OPAC</label>
                <input type="range" id="brushOpacity" min="1" max="100" value="100">
            </div>
        </div>

        <div id="stage-container">
            <div id="canvas-wrapper">
                <canvas id="onionCanvas" width="1920" height="1080"
                    style="position: absolute; pointer-events: none; z-index: 1; opacity: 0.4;"></canvas>

                <canvas id="mainCanvas" width="1920" height="1080"
                    style="position: relative; z-index: 2; background: transparent; pointer-events: auto;"></canvas>

            </div>
        </div>
    </div>

    <div id="timeline-panel">
        <div class="controls">
            <button id="playBtn">▶ PLAY</button>

            <div class="timeline-slider-container">
                <span>FPS</span>
                <input type="number" id="fpsInput" value="12" style="width: 32px;">

                <span style="margin-left: 10px;">LEN</span>
                <input type="number" id="durationInput" value="60" style="width: 40px;">

                <span id="frameCounter" style="font-family: monospace; color: var(--accent); margin-left: 10px;">00 /
                    60</span>

                <input type="range" id="frameSlider" min="0" max="60" value="0">

                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" id="loopToggle" checked> LOOP
                </label>
            </div>
        </div>

        <div id="frame-strip"></div>
    </div>

    <div id="frame-context-menu"
        style="display: none; position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 20000; min-width: 120px; padding: 5px 0;">
        <style>
            .menu-item {
                padding: 8px 12px;
                font-size: 11px;
                cursor: pointer;
                color: var(--text);
                transition: background 0.2s;
            }

            .menu-item:hover {
                background: var(--accent);
            }

            .menu-item.danger:hover {
                background: #cc3333;
            }
        </style>
        <div class="menu-item" id="ctx-duplicate">Duplicate Frame</div>
        <div class="menu-item" id="ctx-clear">Clear Content</div>
        <div style="height: 1px; background: var(--border); margin: 5px 0;"></div>
        <div class="menu-item danger" id="ctx-delete">Remove Frame</div>
    </div>

    <div id="export-overlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px);">
        <div style="color: var(--accent); font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;">EXPORTING
            ENGINE...</div>
        <div id="export-bar-bg"
            style="width: 200px; height: 4px; background: #222; border-radius: 2px; overflow: hidden;">
            <div id="export-bar-fill"
                style="width: 0%; height: 100%; background: var(--accent); transition: width 0.3s;"></div>
        </div>
        <div id="export-status"
            style="font-size: 10px; color: var(--text-dim); margin-top: 10px; font-family: monospace;">0%</div>
    </div>

    <script type="module" src="desktop-renderer.js"></script>

    <!-- <script type="module">

        document.body.appendChild(script);
    </script> -->

</html>
